name: Helm Chart Validation

on:
  push:
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - "Chart.yaml"
      - "values.yaml"
      - "templates/**"
  pull_request:
    paths:
      - "**/*.yaml"
      - "**/*.yml"
      - "**/*.json"
      - "Chart.yaml"
      - "values.yaml"
      - "templates/**"

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2

      - name: Run chart-testing (lint)
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --charts chart

      - name: Run helm lint
        run: helm lint chart

      - name: Run helm template validation
        run: helm template chart --debug

      - name: Assert NetworkPolicy renders only when enabled
        run: |
          default_count=$(helm template chart | grep -c '^kind: NetworkPolicy' || true)
          if [ "$default_count" -ne 0 ]; then
            echo "expected 0 NetworkPolicy objects with default values, got $default_count"
            exit 1
          fi
          enabled_count=$(helm template chart -f chart/ci/networkpolicy-values.yaml | grep -c '^kind: NetworkPolicy' || true)
          if [ "$enabled_count" -ne 1 ]; then
            echo "expected 1 NetworkPolicy object with networkPolicy.enabled=true, got $enabled_count"
            exit 1
          fi
