# Default values for reusable-helm-chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# @param global Global configuration for the chart
# Example:
# global:
#   # Enable metrics annotations for prometheus or scrape config for victoria metrics
#   metrics:
#     enabled: true
#     path: /metrics
#     port: "http"
#   imagePullSecrets:[]
#   # Create ClusterRole/Role and ClusterRoleBinding/RoleBinding
#   rbac:
#       create: false
#       # Name of the ClusterRole/Role and ClusterRoleBinding/RoleBinding
#       # Default value is {{ include "tvpp-helm-chart.fullname" . }}
#       name: ""
#       # If true - Role and RoleBinding will be created
#       # If false - ClusterRole and ClusterRoleBinding will be created
#       namespaced: false
#       aggregationRule: {}
#       rules: []
#       annotations: {}
#   serviceAccount:
#     create: false
#     annotations: {}
#     # The name of the service account to use.
#     # If not set and create is true, a name is generated using the fullname template
#     name: ""
#
global:
  metrics:
    enabled: true
    path: /metrics
    port: "http"
    scrapeTimeout: 10s
    interval: 60s
  imagePullSecrets: []
  rbac:
    create: false
    name: ""
    namespaced: false
    aggregationRule: {}
    rules: []
    annotations: {}
  serviceAccount:
    create: true
    annotations: {}
    automount: true
    name: ""

# @param dbMigration DB Migration configuration for the chart
# Example:
# dbMigration:
#   enabled: true
#   image:
#     repository: liquibase/liquibase
#     pullPolicy: IfNotPresent
#     tag: "4.28.0-alpine"
#   env:
#     POSTGRES_URL: postgres://user:password@host:5432/db
#     POSTGRES_USERNAME: user
#     POSTGRES_PASSWORD: password
#   externalSecrets:
#     name-of-the-secret:
#       # Name of the secret store
#       secretStoreName: vault-backend
#       # Path to vault secret
#       secretPath: path/to/secret
#       properties:
#         # Mapping vault_property: secret_property
#         property1: secret_property1
#         property2: secret_property2
#   command:
#     - sh
#     - -c
#     - |
#       liquibase \
#         --search-path=/dbMigration \
#         update \
#         --url=$POSTGRES_URL \
#         --username=$POSTGRES_USERNAME \
#         --password=$POSTGRES_PASSWORD \
#         --changelog-file=changeset.sql
#   args: []
#   mount:
#     {}
#     # /app/test/path/config: "Dummy config"
#     # /tmp/config: "Config in /tmp"
#     # /bin/config: "Config in /bin"
#   resources: {}
#
dbMigration:
  enabled: false
  image:
    repository: liquibase/liquibase
    pullPolicy: IfNotPresent
    tag: "4.28.0-alpine"

  env: {}
  envFrom: []
  externalSecrets: {}
  command:
    - sh
    - -c
    - |
      liquibase \
        --search-path=/dbMigration \
        update \
        --url=$POSTGRES_URL \
        --username=$POSTGRES_USERNAME \
        --password=$POSTGRES_PASSWORD \
        --changelog-file=changeset.sql
  args: []
  mount: {}
    # /app/test/path/config: "Dummy config"
    # /tmp/config: "Config in /tmp"
    # /bin/config: "Config in /bin"
    # /dbMigration/changeset.sql: {{ readFile "../../app/migrations/changeset.sql" | quote }}

  resources: {}

# @param mongodb MongoDB configuration for the application
# Example:
# enabled: true
#
# Name of the MongoDB cluster
# name: mongodb
#
# Number of MongoDB replicas
# replicaCount: 3
#
# Version of MongoDB cluster
# version: 7.0.7
#
# Users to create in MongoDB
# users:
#   - name: my-user
#     db: admin
#     passwordSecretRef: # a reference to the secret that will be used to generate the user's password
#       name: mongodb-my-user-password
#     roles:
#       - name: clusterAdmin
#         db: admin
#       - name: userAdminAnyDatabase
#         db: admin
#     scramCredentialsSecretName: my-scram
#     connectionStringSecretNamespace: other-namespace
# Roles to create in MongoDB
# roles:
#   - role: testRole
#     db: admin
#     privileges:
#       - resource:
#           db: "test"
#           collection: "" # an empty string indicates any collection
#         actions:
#           - find
#     roles: []
# External secrets to use with MongoDB
# Default resources to allocate for the MongoDB pods
# resources:
#   mongod: {}
#   agent: {}
# Storage settings for MongoDB
# storage:
#   data: 10Gi
#   logs: 2Gi
#
mongodb:
  enabled: false

  name: mongodb
  replicaCount: 3
  version: 7.0.7

  users: []
  roles: []

  resources:
    mongod: {}
    agent: {}

  storage:
    data: 10Gi
    logs: 2Gi

# @param deployment Deployment configuration for the chart
# Deployment is used by default
# Example:
# deployment:
#   # Can't be enabled: true together with statefulset.enabled: true
#   enabled: true
#   strategy:[]
#
deployment:
  enabled: true
  strategy:
    type: RollingUpdate

# @param statefulset Statefulset configuration for the chart
# Example:
# statefulset:
#   # Can't be enabled: true together with deployment.enabled: true
#   enabled: true
#
statefulset:
  enabled: false

nameOverride: ""
fullnameOverride: ""

# @param replicaCount Number of replicas for deployment and statefulset
# Example:
# replicaCount: 2
#
replicaCount: 2

# @param image Image configuration for application
# Repository param is *REQUIRED*
# Example:
# image:
#   repository: ""
#   pullPolicy: IfNotPresent
#
image:
  repository: "gcr.io/google_containers/echoserver"
  pullPolicy: IfNotPresent

# @param extraEnv Extra environment variables to be set on application container
# Example:
# extraEnv:
#   - name: FOO
#     value: "bar"
#
extraEnv: []

# @param extraConfigMap Extra configmaps to be set on application container
# Example:
# extraConfigMap:
#   - name: FOO
#     mountPath: /mount/path/to/
#     subPath: /if/needed
#     data:
#       key: value
#
extraConfigMap: []

# @param extraEnvFrom Additional environment variables for application mapped from Secret or ConfigMap
# Example:
# extraEnvFrom:
#   - configMapRef:
#       name: FOO
#   - secretRef:
#       name: FOO
#
extraEnvFrom: []

# @param extraMemoryMount Extra memory mounts for application container
# Example:
# extraMemoryMount:
#   - name: FOO
#     mountPath: /mount/path/to
#     subPath: /if/needed
#     sizeLimit: 500Mi
extraMemoryMount: []

# @param extraVolumeMounts Extra volume mounts for application container
# Example:
# extraVolumeMounts:
#   - name: config-volume
#     mountPath: /etc/config
#     subPath: /if/needed
#     volumeSource:
#       configMap:
#         name: my-config-map
#   - name: secret-volume
#     mountPath: /etc/secrets
#     subPath: /if/needed
#     volumeSource:
#       secret:
#         secretName: my-secret
#
extraVolumeMounts: []

# @param extraFileMount Extra file mounts for application container
# Example:
# extraFileMount:
#   /app/test/path/config: "Dummy config"
#   /tmp/config: "Config in /tmp"
#   /bin/config: "Config in /bin"
extraFileMount: {}

# @param command Command to run in the container
# Example:
# command: ["/bin/sh", "-c", "echo hello"]
#
command: []

# @param args Arguments to pass to the command
# Example:
# args: ["arg1", "arg2"]
#
args: []

# @param initContainers List of init containers for the application
# Example:
# initContainers:
#   - name: init-container-name
#     image:
#       repository: ""
#       pullPolicy: IfNotPresent
#       tag: ""
#     securityContext: {}
#     extraEnv:
#       - name: FOO
#         value: "bar"
#     extraEnvFrom:
#       - configMapRef:
#           name: FOO
#       - secretRef:
#           name: FOO
#     extraConfigMap:
#       - name: FOO
#         mountPath: /mount/path/to/
#         subPath: /if/needed
#         data:
#           key: value
#     extraMemoryMount:
#       - name: FOO
#         mountPath: /mount/path/to
#         subPath: /if/needed
#         sizeLimit: 500Mi
#     command: []
#     resources: {}
#
initContainers: []

# @param sidecars List of sidecar containers for the application
# Example:
# sidecars:
#   - name: sidecar-container-name
#     image:
#       repository: ""
#       pullPolicy: IfNotPresent
#       tag: ""
#     extraEnv:
#       - name: FOO
#         value: "bar"
#     extraEnvFrom:
#       - configMapRef:
#           name: FOO
#       - secretRef:
#           name: FOO
#     extraConfigMap:
#       - name: FOO
#         mountPath: /mount/path/to/
#         subPath: /if/needed
#         data:
#           key: value
#     extraMemoryMount:
#       - name: FOO
#         mountPath: /mount/path/to
#         subPath: /if/needed
#         sizeLimit: 500Mi
#     command: []
#
sidecars: []

# @param externalSecrets External secrets for the application
# Only available for Kubernetes
# Example:
# externalSecrets:
#   name-of-the-secret:
#     # Name of the secret store
#     secretStoreName: vault-backend
#     # Path to vault secret
#     secretPath: path/to/secret
#     properties:
#       # Mapping vault_property: secret_property
#       property1: secret_property1
#       property2: secret_property2
externalSecrets: {}

# @param extraSecrets Additional secrets to create for the application
# Example:
# extraSecrets:
#   - name: my-app-secrets
#     type: Opaque
#     data:
#       DATABASE_URL: "postgres://user:password@localhost:5432/mydb"
#       API_KEY: "my-secret-api-key"
#       JWT_SECRET: "jwt-signing-secret"
#   - name: tls-certificates
#     type: kubernetes.io/tls
#     data:
#       tls.crt: "base64-encoded-cert"
#       tls.key: "base64-encoded-key"
extraSecrets: []

# @param podAnnotations Annotations object for application
# Example:
# podAnnotations:
#   application.framework: "golang"
#
podAnnotations: {}

# @param podSecurityContext Security context for the whole deployment
# Example:
# podSecurityContext:
#   fsGroup: 2000
#
podSecurityContext: {}

# @param securityContext Security context for the application container
# Example:
# securityContext:
#   capabilities:
#     drop:
#     - ALL
#   readOnlyRootFilesystem: true
#   runAsNonRoot: true
#   runAsUser: 1000
#
securityContext: {}

# @param service Service configuration for the application
# Example:
# service:
#   type: ClusterIP
#   annotations:
#     nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
#     nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
#   ports:
#     - port: 80
#       targetPort: 8080
#       name: http
#
service:
  type: ClusterIP
  annotations: {}
  ports:
    - port: 80
      targetPort: 8080
      name: http

# @param cronjob list
# Example:
# cronjob:
# - name: cronjob-name
#   image:
#     repository: ""
#     pullPolicy: ""
#     tag: ""
#   schedule: ""
#   successfulJobsHistoryLimit: 1
#   failedJobsHistoryLimit: 3
#   extraEnv:
#     - name: FOO
#       value: "bar"
#   extraEnvFrom:
#     - configMapRef:
#         name: FOO
#     - secretRef:
#         name: FOO
#   extraConfigMap:
#     - name: FOO
#       mountPath: /mount/path/to/
#       subPath: /if/needed
#       data:
#         key: value
#   extraMemoryMount:
#     - name: FOO
#       mountPath: /mount/path/to
#       subPath: /if/needed
#       sizeLimit: 500Mi
#   command: []
#   podAnnotations: {}
#   nodeSelector: {}
#
cronjob: []

# @param ingress List of Ingress objects for the application
# Example:
# ingress:
#   - nameSuffix: "api"
#     className: "nginx"
#     annotations:
#       nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
#       nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
#     hosts:
#       - host: chart-example.local
#         paths:
#           - path: /
#             pathType: ImplementationSpecific
#         servicePort: 80
#     tls:
#       - secretName: chart-example-tls
#         hosts:
#           - chart-example.local
#   - nameSuffix: "web"
#     className: "nginx-external"
#     annotations:
#       nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
#       nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
#     hosts:
#       - host: web.chart-example.local
#         paths:
#           - path: /
#             pathType: ImplementationSpecific
#         servicePort: 8080
#     tls:
#       - secretName: chart-example-tls
#         hosts:
#           - chart-example.local
#
ingress: []

# @param httpRoutes List of HTTPRoute objects for the application (Gateway API)
# Example:
# httpRoutes:
#   - nameSuffix: "api"
#     parentRefs:
#       - name: internal
#         namespace: envoy-gateway-system
#         sectionName: https
#     hostnames:
#       - my-app.gw.dev.chirpwireless.io
#     rules:
#       - matches:
#           - path: /
#             pathType: PathPrefix
#         servicePort: 8080
#     # Optional: local rate limiting (creates BackendTrafficPolicy)
#     # Note: Local rate limiting is per-Envoy-instance. Global rate limiting
#     # requires a dedicated rate limit service (e.g. Redis) and is not supported here.
#     rateLimit:
#       rules:
#         - requests: 100
#           unit: Minute
#         - requests: 10
#           unit: Second
#           clientSelectors:
#             - headers:
#                 - name: x-api-key
#                   type: Distinct
#     # Optional: auth (creates SecurityPolicy)
#     # JWT validation:
#     auth:
#       jwt:
#         providers:
#           - name: zitadel
#             issuer: https://your-zitadel.zitadel.cloud
#             jwksUri: https://your-zitadel.zitadel.cloud/oauth/v2/keys
#             claimToHeaders:
#               - header: x-user-id
#                 claim: sub
#     # OR OIDC (redirect to login page):
#     # auth:
#     #   oidc:
#     #     issuer: https://your-zitadel.zitadel.cloud
#     #     clientID: your-client-id
#     #     clientSecretName: zitadel-oidc-secret
#     #     redirectURL: https://my-app.gw.dev.chirpwireless.io/oauth2/callback
#     #     scopes:
#     #       - openid
#     #       - profile
#     #       - email
#
httpRoutes: []

# @param grpcRoutes List of GRPCRoute objects for the application (Gateway API)
# Example:
# grpcRoutes:
#   - nameSuffix: "grpc"
#     parentRefs:
#       - name: public-api
#         namespace: envoy-gateway-system
#         sectionName: https-dev-chirpwireless-io
#     hostnames:
#       - api.dev.chirpwireless.io
#     rules:
#       - matches:
#           - service: mypackage.MyService
#             method: MyMethod
#         servicePort: 50051
#     # Optional: local rate limiting (creates BackendTrafficPolicy)
#     rateLimit:
#       rules:
#         - requests: 100
#           unit: Minute
#     # Optional: auth (creates SecurityPolicy with JWT/OIDC)
#     auth:
#       jwt:
#         providers:
#           - name: zitadel
#             issuer: https://your-zitadel.zitadel.cloud
#             jwksUri: https://your-zitadel.zitadel.cloud/oauth/v2/keys
#
grpcRoutes: []

# @param persistence Persistence configuration for the chart
# Example:
# persistence:
#   enabled: true
#   annotations:
#     backup.velero.io/backup-volumes: "true"
#   accessModes:
#     - ReadWriteOnce
#   size: 15Gi
#   storageClass: ""
# extraVolumeMounts:
#   - name: data
#     mountPath: /data
#     volumeSource:
#       persistentVolumeClaim:
#         claimName: <release-name>-pvc
# Note: The PVC is created with the 'helm.sh/resource-policy: keep' annotation,
# which prevents Helm from deleting or modifying it during upgrades.
# This is necessary because PVCs are immutable after creation except for
# resources.requests and volumeAttributesClassName fields.
#
persistence:
  enabled: false
  annotations: {}
  accessModes:
    - ReadWriteOnce
  size: 15Gi
  storageClass: ""

# @param resources Resources for the application
# Example:
# resources:
#   limits:
#     cpu: 1000m
#     memory: 2000Mi
#   requests:
#     cpu: 100m
#     memory: 1000Mi
#
resources:
  limits:
    memory: 2000Mi
  requests:
    cpu: 200m
    memory: 1000Mi

# @param startupProbe StartupProbe for the application
# Example:
# startupProbe:
#   failureThreshold: 50
#   periodSeconds: 10
#   httpGet:
#     path: /health
#     port: http
#     scheme: HTTP
#   grpc:
#     port: 8080
#     service: my.service.name
#
startupProbe: {}

# @param livenessProbe LivenessProbe for the application
# Example:
# livenessProbe:
#   failureThreshold: 5
#   initialDelaySeconds: 0
#   periodSeconds: 10
#   successThreshold: 1
#   timeoutSeconds: 1
#   httpGet:
#     path: /health
#     port: http
#     scheme: HTTP
#   grpc:
#     port: 8080
#     service: my.service.name
#
livenessProbe: {}

# @param readinessProbe ReadinessProbe for the application
# Example:
# readinessProbe:
#   failureThreshold: 5
#   initialDelaySeconds: 0
#   periodSeconds: 10
#   successThreshold: 1
#   timeoutSeconds: 1
#   httpGet:
#     path: /health
#     port: http
#     scheme: HTTP
#   grpc:
#     port: 8080
#     service: my.service.name
#
readinessProbe: {}

# @param autoscaling Autoscaling for the application
# Example:
# autoscaling:
#   enabled: false
#   minReplicas: 2
#   maxReplicas: 10
#   behavior:
#     scaleUp:
#       policies:
#         # Scale Up As Fast As Possible
#         # 1 -> 2 -> 4 -> 8 ...
#         - type: Percent
#           value: 100
#           periodSeconds: 60
#     scaleDown:
#       policies:
#         # Scale Down Very Gradually
#         # Scale down one pod every 10 min
#         - type: Pods
#           value: 1
#           periodSeconds: 600
#   targetCPUUtilizationPercentage: 80
#   targetMemoryUtilizationPercentage: 80
#
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleUp:
      # Do not want to react to false positive signals, i.e. to short spikes of events
      stabilizationWindowSeconds: 300
      policies:
        # Scale Up As Fast As Possible
        # 1 -> 2 -> 4 -> 8 ...
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      # Do not scale down pods too early, expecting some late load spikes
      stabilizationWindowSeconds: 600
      policies:
        # Scale Down Very Gradually
        # Scale down one pod every 10 min
        - type: Pods
          value: 1
          periodSeconds: 600
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# @param natsStreams NATS JetStream Streams to create
# Example:
# natsStreams:
#   my-stream:
#     description: "My event stream"
#     subjects:
#       - "events.>"
#     storage: file
#     retention: limits
#     replicas: 3
#     maxAge: 72h
#     maxBytes: -1
#     maxMsgSize: -1
#     maxMsgs: -1
#     maxConsumers: -1
#     discard: old
#     duplicateWindow: 2m
#
natsStreams: {}

# @param natsStreamsConsumers NATS JetStream Consumers to create
# Example:
# natsStreamsConsumers:
#   my-consumer:
#     streamName: my-stream
#     description: "My event consumer"
#     deliverPolicy: all
#     ackPolicy: explicit
#     ackWait: 30s
#     maxAckPending: 1000
#     maxDeliver: 5
#     filterSubject: "events.created"
#     replayPolicy: instant
#
natsStreamsConsumers: {}

# @param nodeSelector NodeSelector for the application
# Example:
# nodeSelector: {}
#
nodeSelector: {}

# @param tolerations Tolerations for the application
# Example:
# tolerations: []
#
tolerations: []
