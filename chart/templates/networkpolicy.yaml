{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "reusable-helm-chart.fullname" . }}
  labels:
    {{- include "reusable-helm-chart.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- if .Values.networkPolicy.podSelector }}
      {{- toYaml .Values.networkPolicy.podSelector.matchLabels | nindent 6 }}
      {{- else }}
      {{- include "reusable-helm-chart.selectorLabels" . | nindent 6 }}
      {{- end }}
  policyTypes:
    {{- if .Values.networkPolicy.restrictIngress }}
    - Ingress
    {{- end }}
    {{- if .Values.networkPolicy.egress }}
    - Egress
    {{- end }}
  {{- if .Values.networkPolicy.restrictIngress }}
  ingress:
    {{- toYaml .Values.networkPolicy.ingress | nindent 4 }}
  {{- end }}
  {{- if .Values.networkPolicy.egress }}
  egress:
    {{- toYaml .Values.networkPolicy.egress | nindent 4 }}
  {{- end }}
{{- end }}
