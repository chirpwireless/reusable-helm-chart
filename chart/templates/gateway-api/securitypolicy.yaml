{{- range .Values.httpRoutes }}
{{- if or .auth .cors }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "reusable-helm-chart.fullname" $ }}{{ if .nameSuffix }}-{{ .nameSuffix }}{{ end }}-security-policy
  labels:
    {{- include "reusable-helm-chart.labels" $ | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "reusable-helm-chart.fullname" $ }}{{ if .nameSuffix }}-{{ .nameSuffix }}{{ end }}
  {{- with .cors }}
  cors:
    allowOrigins:
      {{- range .allowOrigins | default (list "*") }}
      - {{ . | quote }}
      {{- end }}
    allowMethods:
      {{- range .allowMethods | default (list "GET" "POST" "PUT" "PATCH" "DELETE" "OPTIONS") }}
      - {{ . }}
      {{- end }}
    {{- with .allowHeaders }}
    allowHeaders:
      {{- range . }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- with .exposeHeaders }}
    exposeHeaders:
      {{- range . }}
      - {{ . | quote }}
      {{- end }}
    {{- end }}
    {{- with .maxAge }}
    maxAge: {{ . }}
    {{- end }}
  {{- end }}
  {{- with .auth }}
  {{- with .jwt }}
  jwt:
    providers:
      {{- range .providers }}
      - name: {{ .name }}
        issuer: {{ .issuer }}
        remoteJWKS:
          uri: {{ .jwksUri }}
        {{- with .claimToHeaders }}
        claimToHeaders:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
  {{- end }}
  {{- with .oidc }}
  oidc:
    provider:
      issuer: {{ .issuer }}
    clientID: {{ .clientID }}
    clientSecret:
      name: {{ .clientSecretName }}
    redirectURL: {{ .redirectURL }}
    {{- with .scopes }}
    scopes:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  {{- end }}
  {{- end }}
---
{{- end }}
{{- end }}
